{% extends 'base.html' %}{% block content %}<section class="card"><h1>Ablesungen</h1><p>Fünf vollständige Durchgänge. Punkt oder Komma als Dezimalzeichen möglich.</p><form method="post" class="readings">{% for point in points %}<fieldset><legend>{{point}}</legend>{% for i in range(5) %}<label>{{i+1}}<input inputmode="decimal" name="{{point}}" value="{{existing[point][i] if existing[point]|length>i else ''}}"></label>{% endfor %}</fieldset>{% endfor %}<button>Speichern & auswerten</button></form></section>{% endblock %}
